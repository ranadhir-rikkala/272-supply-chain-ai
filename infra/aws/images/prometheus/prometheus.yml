# AWS version of monitoring/prometheus/prometheus.yml. Targets are ECS Service Connect
# names. The ETL worker is not deployed on AWS (feeds are loaded by a one-off task).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: platform-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["platform-api:8080"]

  - job_name: forecast-api
    metrics_path: /metrics
    static_configs:
      - targets: ["forecast-api:8000"]

  - job_name: forecast-worker
    static_configs:
      - targets: ["forecast-worker:9100"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq-metrics:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq-metrics:15692"]
